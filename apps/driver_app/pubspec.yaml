name: driver_app
description: Dapur Gizi Driver — Aplikasi driver mitra
publish_to: none
resolution: workspace
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Monorepo packages
  core:
    path: ../../packages/core
  ui_kit:
    path: ../../packages/ui_kit
  map_kit:
    path: ../../packages/map_kit

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.17

  # Utils
  url_launcher: ^6.3.2
  pinput: ^6.0.2

  # Firebase
  firebase_core: ^3.12.1
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
